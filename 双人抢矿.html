<script>
'use strict';
const el=id=>document.getElementById(id), ctx=document.querySelector('canvas').getContext('2d');
const types={small:[30,220,12],gold:[65,145,18],giant:[120,82,30],rock:[5,90,16],gem:[90,135,15]};
const seats={2:[260,700],3:[175,480,785],4:[135,365,595,825]};
let count=2,origins=seats[2],mySeat=0,capture=-1,uiCount=0;
const colors=['#ff9965','#68dbcf','#e89fd9','#dcda80'];
const defaults=['Space','Enter','KeyF','KeyJ'];
const allowedKey=code=>/^(?:Space|Enter|NumpadEnter|Key[A-Z]|Digit[0-9]|Numpad[0-9]|Arrow(?:Left|Right|Up|Down)|Comma|Period|Slash|Semicolon|Quote|BracketLeft|BracketRight|Backslash|Minus|Equal|Backquote)$/.test(code);
let keys=defaults.slice();
try{const saved=JSON.parse(localStorage.getItem('mine-keys'));if(Array.isArray(saved)&&saved.length===4&&new Set(saved).size===4&&saved.every(allowedKey))keys=saved;}catch{}
function labelKey(code){return ({Space:'空格',Enter:'回车',NumpadEnter:'小键盘回车',ArrowDown:'↓',ArrowUp:'↑',ArrowLeft:'←',ArrowRight:'→'})[code]||code.replace(/^Key|^Digit/,'').replace(/^Numpad/,'小键盘 ');}
function setCount(n){if(![2,3,4].includes(n))throw Error('房间人数无效');count=n;origins=seats[n];}
const totalEarned=()=>game.scores.reduce((a,b)=>a+b,0);
const REST_LENGTH=23, WINCH_Y=145;
let game, scene='', role='local', tie=0, feedback=[], sentAt=0, lastPanel='', lastSave=0, saveMessage='';
const cooldown={small:4,gold:7,giant:12,rock:5,gem:9};
const nextLevel=level=>150*level*(level+1);
const price=(kind,rank)=>Math.ceil((kind==='winch'?40:60)*1.65**rank);
const works=[['修井架',120],['装绞车',240],['接通动力',360]];
const grades={small:[22,38],gold:[48,82],giant:[95,145],rock:[3,8],gem:[72,108]};
const saleValue=o=>Math.min(500,o.base*game.level);
function randomInt(low,high){return low+Math.floor(Math.random()*(high-low+1));}
function newOreSlot(ores,gemSlot=false){
  const slot=ore(gemSlot?'gem':'small',0,0);
  slot.gone=true;slot.gemSlot=gemSlot;ores.push(slot);refill(slot,ores);
}
function refill(slot,ores){
  const roll=Math.random();
  const kind=slot.gemSlot?'gem':roll<.40?'small':roll<.72?'gold':roll<.87?'giant':'rock';
  const radius=types[kind][2];
  for(let attempt=0;attempt<64;attempt++){
    const x=randomInt(50,910),y=randomInt(211,561-radius);
    const inReach=ox=>Math.abs(Math.atan2(x-ox,y-WINCH_Y))<=1.20;
    if(slot.gemSlot?!origins.every(inReach):!origins.some(inReach))continue;
    if(slot.homeY>0&&Math.hypot(x-slot.homeX,y-slot.homeY)<55)continue;
    if(ores.some(o=>o!==slot&&!o.gone&&Math.hypot(x-o.x,y-o.y)<radius+types[o.kind][2]+16))continue;
    Object.assign(slot,ore(kind,x,y),{base:randomInt(...grades[kind]),grade:randomInt(0,2)});return;
  }
  slot.regen=.25;
}
function advanceProject(){
  const task=works[game.project.stage];
  if(task&&game.project.paid>=task[1]&&(game.project.stage<2||game.project.gems>=2)){
    game.project.stage++;game.project.paid=0;
  }
}
function ore(kind,x,y){return {kind,x,y,homeX:x,homeY:y,owner:-1,gone:false,regen:0};}
const goods=[
  {id:'oil',name:'强力油',cost:20,uses:3,tip:'三次巨金或石块回收加速一倍'},
  {id:'plan',name:'碎石图纸',cost:35,uses:1,tip:'下次交付石块，永久增加一台尾矿机，每5秒赚2金'},
  {id:'polish',name:'宝石抛光布',cost:45,uses:2,tip:'两次宝石交付增值50%，单块上限500金'}
];
function addSupplyState(mine){
  mine.shelf=goods.map((_,i)=>({x:315+165*i,y:375,owner:-1,wait:0}));
  mine.bags=mine.hooks.map(()=>({oil:0,plan:0,polish:0,mill:0,message:''}));
  for(const h of mine.hooks)Object.assign(h,{shopping:false,box:-1,oiled:false});
  mine.version=4;return mine;
}
const faunaEnabled=false;
const sites={mine:'金矿井',lake:'地下渔场',burrow:'旧矿鼠道'};
const wildlife={silver:['银鱼',18,34,14,210,4,1.05,'#aee3eb'],carp:['鲤鱼',38,62,18,170,6,.72,'#ff9968'],goldfin:['金鳍鱼',72,105,20,145,9,1.45,'#f1cc58'],gray:['灰鼠',20,36,14,205,4,.8,'#a7b4ae'],mole:['鼹鼠',42,68,18,165,6,.56,'#ce9b83'],goldback:['金背鼠',75,110,18,140,9,1.36,'#e7be65']};
for(const [kind,[,lo,hi,r,speed,wait]] of Object.entries(wildlife)){types[kind]=[lo,speed,r];grades[kind]=[lo,hi];cooldown[kind]=wait;}
function addCoop(mine){
  for(const h of mine.hooks){h.leader=-1;h.helper=-1;}
  mine.version=6;return mine;
}
const walkKeys=[['KeyA','KeyD'],['ArrowLeft','ArrowRight'],['KeyG','KeyH'],['KeyK','KeyL']];
const qualities=['夹杂','净料','晶心'];
function addSurface(mine,existing=false){
  mine.ground=origins.map((x,p)=>({x:existing&&mine.hooks[p].mode!=='aim'?x:x+(p%2?60:-60),dir:0,cargo:null}));mine.version=8;return mine;
}
const CUT_COST=8, CUT_SECONDS=3;
function addCharter(mine){mine.charter={samples:[null,null],opening:null};mine.version=13;return mine;}
function checkOpening(){
  const book=game.charter;
  if(book.opening||!game.project.launched||!book.samples.every(Boolean))return;
  book.opening={production:totalEarned(),orders:game.contractCount};
}
function workshop(mine){mine.tables=mine.hooks.map(()=>false);mine.version=12;return mine;}
const gemHue=c=>c.hue??(c.base%2);
function exhibitionCut(c){return game.project.launched&&!game.charter.samples[gemHue(c)];}
function cutQuote(value){return Math.min(500,Math.floor(value*1.25));}
function appraisal(mine){mine.appraised=mine.hooks.map(()=>0);mine.version=11;return mine;}
function lamplight(c){return c.grade===2||(c.grade===1&&c.base%2===0)?'光晕通透，偏向净料或晶心':'暗线较多，偏向夹杂或净料';}
function sharedRigs(mine){mine.hooks.forEach((h,p)=>{h.rig=p;});mine.version=10;return mine;}
function nearbyRig(p){return origins.findIndex(x=>Math.abs(game.ground[p].x-x)<=32);}
function operatorOf(rig){return game.hooks.findIndex(h=>h.rig===rig&&h.mode!=='aim');}
function availableRig(p){const rig=nearbyRig(p),owner=operatorOf(rig);return rig>=0&&(owner===-1||owner===p);}
function rigName(rig){return rig%2===0?'快卷机':'重载机';}
function rigReturnMultiplier(rig,kind){
  const compatible=rig%2===0?['small','gold']:['giant','rock'];
  return compatible.includes(kind)?1.35:1;
}
function chooseRig(p){
  const h=game.hooks[p],rig=nearbyRig(p);if(rig<0||!availableRig(p))return false;
  h.rig=rig;h.x=origins[rig]+Math.sin(h.angle)*REST_LENGTH;h.y=WINCH_Y+Math.cos(h.angle)*REST_LENGTH;return true;
}
const nearRig=p=>nearbyRig(p)>=0;
const nearShop=p=>Math.min(Math.abs(game.ground[p].x-45),Math.abs(game.ground[p].x-915))<=45;
const canDig=p=>availableRig(p)&&!game.ground[p].cargo&&game.hooks[p].mode==='aim';
function fixedGrade(o){return o.grade??Math.abs(Math.round(o.homeX+o.homeY+o.base))%3;}
function quote(c){
  const value=Math.min(500,Math.max(1,Math.floor(c.base*(c.opened?[65,100,145][c.grade]:85)/100)));
  return c.cut&&c.opened?cutQuote(value):value;
}
const orders=[
  {name:'原石备料',need:'交付一块未开原石',bonus:15,accepts:c=>!c.opened},

function trade(p,action){

  const miner=game.ground[p],hook=game.hooks[p];
  if(action==='move_left'||action==='move_right'||action==='move_stop'){
    miner.dir=hook.mode==='aim'&&!(miner.cargo?.workLeft>0)?(action==='move_left'?-1:action==='move_right'?1:0):0;return;
  }

  if(action==='market'){const h=game.hooks[p];if(canDig(p)&&chooseRig(p)){h.shopping=!h.shopping;game.bags[p].message='';updateUI();}return;}

const gemFrames=[0,1,2,3,2,1];
const reduceMotion=matchMedia('(prefers-reduced-motion: reduce)');
function gemSprite(context,x,y,size,row,progress,now){
  if(!gemSheet.complete||!gemSheet.naturalWidth)return;
  const frame=reduceMotion.matches?1:gemFrames[Math.floor(now/180)%gemFrames.length];
  context.save();context.imageSmoothingEnabled=false;
  const reveal=Math.min(1,Math.max(0,progress));
  context.beginPath();context.rect(x,y+size*(1-reveal),size,size*reveal);context.clip();
  context.drawImage(gemSheet,frame*64,row*64,64,64,Math.round(x),Math.round(y),size,size);context.restore();
}
function showCut(canvas,row,progress,now){
  const c=canvas.getContext('2d');c.clearRect(0,0,canvas.width,canvas.height);
  if(progress<1){c.fillStyle='#485554';c.beginPath();c.moveTo(23,33);c.lineTo(38,15);c.lineTo(59,17);c.lineTo(72,39);c.lineTo(65,59);c.lineTo(39,70);c.lineTo(20,56);c.closePath();c.fill();}
  gemSprite(c,12,4,72,row,progress,now);
  if(progress>0&&progress<1){const y=Math.round(4+72*(1-progress));c.fillStyle='#e4cf9b';c.fillRect(22,y,52,1);}
}
let sampleRow=0,sampleStart=-Infinity;
function showSamples(){sampleStart=-Infinity;sampleRow=0;el('gemDialog').showModal();}
function selectSample(row){sampleRow=row;sampleStart=-Infinity;}
el('pickGreen').onclick=()=>selectSample(0);el('pickRed').onclick=()=>selectSample(1);
el('revealSample').onclick=()=>{sampleStart=performance.now();};el('closeGem').onclick=()=>el('gemDialog').close();
function paintGemViews(now){
  if(el('gemDialog').open){const progress=Math.min(1,(now-sampleStart)/(CUT_SECONDS*1000));showCut(el('sampleCanvas'),sampleRow,progress,now);
    const caption=(sampleRow?'红宝石 · 枕形切面':'绿宝石 · 长阶梯切面')+(progress<1?'　切割中':'');if(el('gemCaption').textContent!==caption)el('gemCaption').textContent=caption;
    el('pickGreen').setAttribute('aria-pressed',String(sampleRow===0));el('pickRed').setAttribute('aria-pressed',String(sampleRow===1));}
  if(scene!=='game')return;
  game.ground.forEach((g,p)=>{const canvas=el('jewel'+p),c=g.cargo;if(canvas&&!canvas.hidden&&c)showCut(canvas,gemHue(c),c.cut?1:1-c.workLeft/CUT_SECONDS,now);});
}

    if(Number.isInteger(data.seat)&&[2,3,4].includes(data.count)&&data.seat>0&&data.seat<data.count){mySeat=data.seat;selectedMiner=mySeat;setCount(data.count);return;}
    if(data.lobby){if(el('status'))el('status').textContent='你是 P'+(mySeat+1)+'，已就位 '+data.lobby+' / '+count+' 人。';return;}
    if(data.snapshot?.hooks?.length===count){const previous=scene==='game'?game.scores:data.snapshot.scores;game=data.snapshot;scene='game';game.scores.forEach((v,p)=>{if(v>previous[p])feedback.push({p,value:v-previous[p],at:performance.now()});});updateUI();}
  };
}
async function gathered(pc){if(pc.iceGatheringState==='complete')return;await new Promise(resolve=>{const done=()=>{clearTimeout(timer);pc.removeEventListener('icegatheringstatechange',changed);resolve();};const changed=()=>{if(pc.iceGatheringState==='complete')done();};const timer=setTimeout(done,5000);pc.addEventListener('icegatheringstatechange',changed);});}
function beginPair(which){
  closePeer();role=which;scene='pair';mySeat=0;
  if(!window.RTCPeerConnection){menu('请用支持 WebRTC 的浏览器打开。');return;}invite();
}
async function invite(){
  const hosting=role==='host';const slot=hosting?connected():0;
  panel(hosting?'邀请 P'+(slot+1)+'　·　'+slot+' / '+count+' 人已就位':'加入矿队','<p>'+(hosting?'把本页房间码发给这一位矿友，将对方的应答码粘贴到下方。':'粘贴房主单独发给你的房间码，将生成的应答码发回去。')+'</p><label>收到的连接码<textarea id="incoming" spellcheck="false"></textarea></label><div class="row">'+btn(hosting?'连接这位矿友':'生成应答码','applyCode',true)+btn('返回大厅','back')+'</div><label>'+(hosting?'本座位房间码':'我的应答码')+'<textarea id="outgoing" readonly></textarea></label><small id="status" role="status"></small>');
  el('back').onclick=()=>menu();el('outgoing').onclick=e=>e.target.select();
  const pc=new RTCPeerConnection({iceServers:[]}),link={slot,pc,ch:null};links.set(slot,link);
  const current=()=>links.get(slot)===link;
  pc.ondatachannel=e=>{if(current())attach(link,e.channel);};pc.onconnectionstatechange=()=>{if(current()&&pc.connectionState==='failed')menu('连接失败，请检查局域网后重新配对。');};
  async function offerText(){await gathered(pc);if(current()&&el('outgoing'))el('outgoing').value=btoa(JSON.stringify(pc.localDescription));}
  const status=el('status'),applyButton=el('applyCode');applyButton.onclick=async()=>{applyButton.disabled=true;try{
    const desc=JSON.parse(atob(el('incoming').value.trim()));if(desc.type!==(hosting?'answer':'offer'))throw Error();
    await pc.setRemoteDescription(desc);if(!hosting){await pc.setLocalDescription(await pc.createAnswer());await offerText();}
    if(status.isConnected)status.textContent=hosting?'正在连接…':'请将应答码发给房主，等候全员就位。';
  }catch{if(current()){applyButton.disabled=false;status.textContent='连接码无效，请检查是否使用了当前座位的完整连接码。';}}};
  if(hosting){try{attach(link,pc.createDataChannel('mine'));await pc.setLocalDescription(await pc.createOffer());await offerText();}catch{if(current())menu('浏览器未能生成房间码。');}}
}
let previousTime=0,accumulator=0;
function animation(now){const elapsed=previousTime?Math.min(.25,(now-previousTime)/1000):0;previousTime=now;
  if(scene==='game'&&role!=='guest'){accumulator+=elapsed;while(accumulator>=1/60){if(game.phase==='play')tick(1/60);accumulator-=1/60;}if(role==='host'&&now-sentAt>=40){broadcastGame();sentAt=now;}if(now-lastSave>=1500)save();updateUI();}
  draw();paintGemViews(now);requestAnimationFrame(animation);
}
menu();requestAnimationFrame(animation);
</script></html>
